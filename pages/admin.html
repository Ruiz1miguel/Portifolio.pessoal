<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar portfólio</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
    <h1><a href="../index.html">Meu Portfólio</a></h1>
    <nav><a href="../index.html">Início</a><a href="projetos.html">Projetos</a></nav>
</header>
<main class="painel">
    <p class="sobretitulo">PAINEL ADMINISTRATIVO</p>
    <h1>Gerenciar portfólio</h1>
    <p class="intro-secao">Cadastre, consulte, edite e exclua projetos usando Python e MySQL.</p>
    <section class="secao-nova">
        <h2>Projetos cadastrados</h2>
        <div id="lista-admin-projetos"></div>
    </section>
    <section class="secao-nova">
        <h2 id="titulo-form">Cadastrar projeto</h2>
        <form id="form-projeto">
            <input type="hidden" id="projeto-id">
            <label for="titulo">Título</label><input id="titulo" maxlength="160" required>
            <label for="descricao">Descrição</label><textarea id="descricao" maxlength="5000" required></textarea>
            <label for="tecnologias">Tecnologias</label><input id="tecnologias" maxlength="500" required>
            <label for="link-git">Link GitHub (opcional)</label><input id="link-git" type="url" placeholder="https://github.com/...">
            <div class="acoes-form"><button type="submit">Salvar projeto</button><button type="button" class="btn btn-voltar" id="cancelar">Cancelar edição</button></div>
        </form>
    </section>
    <section class="secao-nova">
        <h2>Mensagens recebidas</h2>
        <p class="intro-secao">Mensagens são privadas e só podem ser consultadas com autorização no servidor.</p>
        <button type="button" id="carregar-mensagens">Carregar mensagens</button>
        <div id="lista-admin-mensagens"></div>
    </section>
    <p id="admin-status" class="status" role="status"></p>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
